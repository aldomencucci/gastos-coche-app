<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Gastos Coche</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos Coche">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --border:#2a2a2a;
    --text:#f5f5f5; --text-dim:#9a9a9a; --accent:#5b8cff; --accent-dim:#1f3a66;
    --ciara:#d97757; --trabajo:#5b8cff; --danger:#e5484d; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:calc(90px + env(safe-area-inset-bottom)); padding-top:env(safe-area-inset-top);}
  #app{max-width:520px; margin:0 auto; padding:16px 16px 0;}
  header{position:sticky; top:0; background:var(--bg); z-index:10; padding:14px 16px 10px; margin:0 -16px 8px;
    border-bottom:1px solid var(--border);}
  header h1{font-size:17px; font-weight:600; margin:0; letter-spacing:-0.2px;}
  .tabs{display:flex; gap:6px; margin-top:12px;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:13px; font-weight:500;
    color:var(--text-dim); background:var(--surface); border:1px solid var(--border); cursor:pointer;}
  .tab.active{background:var(--accent-dim); color:#cfe0ff; border-color:var(--accent);}
  .view{display:none;}
  .view.active{display:block;}

  .summary{display:flex; gap:10px; margin:14px 0;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; flex:1;}
  .card .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .card .value{font-size:22px; font-weight:700; letter-spacing:-0.3px;}

  .filters{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .filters select, .filters input{background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:13px; flex:1; min-width:0;}
  .filters button{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:10px; padding:8px 12px; font-size:13px;}

  .section-title{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;
    margin:18px 0 8px; font-weight:600;}

  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .preset{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; text-align:left; cursor:pointer;}
  .preset .nombre{font-weight:600; font-size:14px; margin-bottom:4px;}
  .preset .ruta{font-size:12px; color:var(--text-dim); margin-bottom:6px; line-height:1.3;}
  .preset .tag{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:600;}
  .tag.CIARA{background:#3a241c; color:var(--ciara);}
  .tag.TRABAJO{background:#1c2b4a; color:var(--trabajo);}
  .preset .km{font-size:11px; color:var(--text-dim); margin-top:6px;}

  .btn-primary{width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:600; cursor:pointer; margin-top:4px;}
  .btn-secondary{width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:14px; font-size:15px; font-weight:500; cursor:pointer; margin-top:10px;}
  .btn-ghost{background:none; border:none; color:var(--text-dim); font-size:13px; padding:6px;}
  .btn-danger{color:var(--danger); background:none; border:none; font-size:13px; padding:4px 8px;}

  .list-item{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .list-item .main{flex:1; min-width:0;}
  .list-item .ruta{font-size:14px; font-weight:500; margin-bottom:3px;}
  .list-item .meta{font-size:11.5px; color:var(--text-dim);}
  .list-item .amount{font-size:16px; font-weight:700; white-space:nowrap;}
  .list-item .del{color:var(--text-dim); font-size:18px; padding:4px 6px; background:none; border:none;}

  .empty{text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0;}

  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;}
  nav.bottom .nav-item{flex:1; text-align:center; color:var(--text-dim); font-size:11px; cursor:pointer;
    padding:4px 0; font-weight:500;}
  nav.bottom .nav-item.active{color:var(--accent);}
  nav.bottom .nav-item .icon{font-size:20px; display:block; margin-bottom:2px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:none;
    align-items:flex-end; justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;}
  .modal h2{font-size:17px; margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  .field input, .field select{width:100%; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px;}
  .seg{display:flex; gap:8px;}
  .seg button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
    color:var(--text-dim); font-size:14px; font-weight:600;}
  .seg button.sel.CIARA{background:#3a241c; color:var(--ciara); border-color:var(--ciara);}
  .seg button.sel.TRABAJO{background:#1c2b4a; color:var(--trabajo); border-color:var(--trabajo);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .toast{position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:10px 16px;
    border-radius:10px; font-size:13px; z-index:200; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}
  .link-btn{color:var(--accent); background:none; border:none; font-size:14px; font-weight:600; padding:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚗 Gastos Coche</h1>
  </header>

  <!-- VIEW: HOME / REGISTRO -->
  <div class="view active" id="view-home">
    <div class="btn-grid" id="presets-grid"></div>
    <button class="btn-secondary" onclick="openManualForm()">+ Viaje manual</button>
    <button class="btn-secondary" onclick="openPresetForm(null)">+ Nuevo viaje predeterminado</button>
  </div>

  <!-- VIEW: LISTADO -->
  <div class="view" id="view-listado">
    <div class="summary">
      <div class="card">
        <div class="label">Total histórico</div>
        <div class="value" id="total-historico">0,00 €</div>
      </div>
      <div class="card">
        <div class="label">Total filtrado</div>
        <div class="value" id="total-filtrado">0,00 €</div>
      </div>
    </div>
    <div class="filters">
      <select id="filtro-mes">
        <option value="">Todos los meses</option>
      </select>
      <select id="filtro-tipo">
        <option value="">Todos los tipos</option>
        <option value="CIARA">Ciara</option>
        <option value="TRABAJO">Trabajo</option>
      </select>
    </div>
    <div class="filters">
      <input type="date" id="filtro-desde">
      <input type="date" id="filtro-hasta">
      <button onclick="limpiarFiltros()">Limpiar</button>
    </div>
    <div id="lista-viajes"></div>
  </div>

  <!-- VIEW: CONFIG -->
  <div class="view" id="view-config">
    <div class="section-title">Tarifa general</div>
    <div class="card" style="margin-bottom:18px;">
      <div class="label">€ por km</div>
      <div class="field" style="margin:8px 0 0;">
        <input type="number" step="0.001" id="input-precio-km">
      </div>
      <button class="btn-primary" onclick="guardarTarifa()">Guardar tarifa</button>
    </div>
    <div class="section-title">Viajes predeterminados</div>
    <div id="lista-presets-config"></div>
  </div>
</div>

<nav class="bottom">
  <div class="nav-item active" data-view="view-home" onclick="switchView('view-home')">
    <span class="icon">⛽</span>Registrar
  </div>
  <div class="nav-item" data-view="view-listado" onclick="switchView('view-listado')">
    <span class="icon">📋</span>Listado
  </div>
  <div class="nav-item" data-view="view-config" onclick="switchView('view-config')">
    <span class="icon">⚙️</span>Config
  </div>
</nav>

<!-- MODAL: confirmar/editar viaje -->
<div class="modal-overlay" id="modal-viaje">
  <div class="modal">
    <h2 id="modal-viaje-title">Confirmar viaje</h2>
    <div class="field">
      <label>Tipo</label>
      <div class="seg">
        <button type="button" id="seg-ciara" onclick="setTipo('CIARA')">Con Ciara</button>
        <button type="button" id="seg-trabajo" onclick="setTipo('TRABAJO')">Trabajo</button>
      </div>
    </div>
    <div class="field"><label>Origen</label><input id="v-origen"></div>
    <div class="field"><label>Destino</label><input id="v-destino"></div>
    <div class="row2">
      <div class="field"><label>Km</label><input type="number" step="0.1" id="v-km" oninput="recalcTotal()"></div>
      <div class="field"><label>€/km</label><input type="number" step="0.001" id="v-preciokm" oninput="recalcTotal()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Total €</label><input type="number" step="0.01" id="v-total"></div>
      <div class="field"><label>Fecha</label><input type="date" id="v-fecha"></div>
    </div>
    <button class="btn-primary" onclick="guardarViaje()">Guardar</button>
    <button class="btn-ghost" style="width:100%; text-align:center; margin-top:6px;" onclick="closeModal('modal-viaje')">Cancelar</button>
  </div>
</div>

<!-- MODAL: crear/editar preset -->
<div class="modal-overlay" id="modal-preset">
  <div class="modal">
    <h2 id="modal-preset-title">Nuevo viaje predeterminado</h2>
    <div class="field"><label>Nombre del botón</label><input id="p-nombre" placeholder="Ej. Casa → Oficina"></div>
    <div class="field">
      <label>Tipo</label>
      <div class="seg">
        <button type="button" id="pseg-ciara" onclick="setTipoPreset('CIARA')">Con Ciara</button>
        <button type="button" id="pseg-trabajo" onclick="setTipoPreset('TRABAJO')">Trabajo</button>
      </div>
    </div>
    <div class="field"><label>Origen</label><input id="p-origen"></div>
    <div class="field"><label>Destino</label><input id="p-destino"></div>
    <div class="field"><label>Km</label><input type="number" step="0.1" id="p-km"></div>
    <button class="btn-primary" onclick="guardarPreset()">Guardar</button>
    <button class="btn-ghost" style="width:100%; text-align:center; margin-top:6px;" onclick="closeModal('modal-preset')">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
