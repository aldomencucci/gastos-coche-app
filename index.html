<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Gastos Coche</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos Coche">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* Paleta clara, alto contraste, pensada para pulsar desde el coche sin mirar fijo */
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2; --border:#1a1d23;
    --text:#10131a; --text-dim:#55596b; --accent:#1f5eff; --accent-dim:#e3ebff;
    --ciara:#c2410c; --ciara-bg:#fdecdc; --trabajo:#1f5eff; --trabajo-bg:#e3ebff;
    --danger:#c81e3a; --radius:18px; --border-w:2.5px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; font-size:17px;}
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom)); padding-top:env(safe-area-inset-top);}
  #app{max-width:560px; margin:0 auto; padding:16px 16px 0;}
  header{position:sticky; top:0; background:var(--bg); z-index:10; padding:16px 16px 14px; margin:0 -16px 10px;
    border-bottom:var(--border-w) solid var(--border);}
  header h1{font-size:22px; font-weight:800; margin:0; letter-spacing:-0.3px;}
  .view{display:none;}
  .view.active{display:block;}

  .summary{display:flex; gap:12px; margin:14px 0 18px;}
  .card{background:var(--surface); border:var(--border-w) solid var(--border); border-radius:var(--radius); padding:16px; flex:1;}
  .card .label{font-size:12.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; font-weight:700;}
  .card .value{font-size:27px; font-weight:800; letter-spacing:-0.4px;}

  .filters{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .filters select, .filters input{background:var(--surface); border:var(--border-w) solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 12px; font-size:15px; flex:1; min-width:0; font-weight:600;}
  .filters button{background:var(--surface2); border:var(--border-w) solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700;}

  .section-title{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;
    margin:22px 0 10px; font-weight:800;}

  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .preset{background:var(--surface); border:var(--border-w) solid var(--border); border-radius:var(--radius);
    padding:18px; text-align:left; cursor:pointer; min-height:120px;}
  .preset .nombre{font-weight:800; font-size:17px; margin-bottom:6px; line-height:1.2;}
  .preset .ruta{font-size:13.5px; color:var(--text-dim); margin-bottom:10px; line-height:1.3; font-weight:600;}
  .preset .tag{display:inline-block; font-size:12px; padding:4px 10px; border-radius:8px; font-weight:800;}
  .tag.CIARA{background:var(--ciara-bg); color:var(--ciara);}
  .tag.TRABAJO{background:var(--trabajo-bg); color:var(--trabajo);}
  .preset .km{font-size:12.5px; color:var(--text-dim); margin-top:8px; font-weight:700;}

  .btn-primary{width:100%; background:var(--accent); color:#fff; border:var(--border-w) solid var(--border);
    border-radius:14px; padding:18px; font-size:17px; font-weight:800; cursor:pointer; margin-top:6px;}
  .btn-secondary{width:100%; background:var(--surface); color:var(--text); border:var(--border-w) solid var(--border);
    border-radius:14px; padding:18px; font-size:17px; font-weight:800; cursor:pointer; margin-top:12px;}
  .btn-ghost{background:none; border:none; color:var(--text-dim); font-size:15px; padding:10px; font-weight:700;}
  .btn-danger{color:var(--danger); background:none; border:none; font-size:14px; padding:4px 8px;}

  .list-item{background:var(--surface); border:var(--border-w) solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .list-item .main{flex:1; min-width:0;}
  .list-item .ruta{font-size:15.5px; font-weight:700; margin-bottom:4px;}
  .list-item .meta{font-size:12.5px; color:var(--text-dim); font-weight:600;}
  .list-item .amount{font-size:18px; font-weight:800; white-space:nowrap;}
  .list-item .del{color:var(--danger); font-size:22px; padding:6px 8px; background:none; border:none; font-weight:700;}

  .empty{text-align:center; color:var(--text-dim); font-size:14px; padding:40px 0; font-weight:600;}

  nav.bottom{position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:var(--border-w) solid var(--border); display:flex; padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;}
  nav.bottom .nav-item{flex:1; text-align:center; color:var(--text-dim); font-size:12.5px; cursor:pointer;
    padding:6px 0; font-weight:700;}
  nav.bottom .nav-item.active{color:var(--accent);}
  nav.bottom .nav-item .icon{font-size:26px; display:block; margin-bottom:3px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(16,19,26,.55); z-index:100; display:none;
    align-items:flex-end; justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    border-top:var(--border-w) solid var(--border);}
  .modal h2{font-size:19px; margin:0 0 18px; font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:7px; font-weight:700;}
  .field input, .field select{width:100%; background:var(--surface2); border:var(--border-w) solid var(--border);
    color:var(--text); border-radius:12px; padding:14px 14px; font-size:17px; font-weight:600;}
  .seg{display:flex; gap:10px;}
  .seg button{flex:1; padding:14px; border-radius:12px; border:var(--border-w) solid var(--border); background:var(--surface2);
    color:var(--text-dim); font-size:15px; font-weight:800;}
  .seg button.sel.CIARA{background:var(--ciara-bg); color:var(--ciara); border-color:var(--ciara);}
  .seg button.sel.TRABAJO{background:var(--trabajo-bg); color:var(--trabajo); border-color:var(--trabajo);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .toast{position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--text); border:var(--border-w) solid var(--border); color:#fff; padding:12px 18px;
    border-radius:12px; font-size:14px; font-weight:700; z-index:200; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}
  .link-btn{color:var(--accent); background:none; border:none; font-size:15px; font-weight:800; padding:0;}
</style>
</head>
<body>

<!-- VIEW: LOGIN -->
<div id="view-login" style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:360px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:40px; margin-bottom:8px;">🚗</div>
      <h1 style="font-size:19px; margin:0;">Gastos Coche</h1>
      <p style="color:var(--text-dim); font-size:13px; margin-top:6px;">Acceso privado</p>
    </div>
    <div class="field"><label>Email</label><input type="email" id="auth-email" autocomplete="username" placeholder="tu@email.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="auth-password" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="iniciarSesion()">Iniciar sesión</button>
    <button class="btn-secondary" onclick="crearCuenta()">Crear cuenta (primera vez)</button>
    <p id="auth-msg" style="text-align:center; font-size:12.5px; color:var(--text-dim); margin-top:14px; min-height:18px;"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>🚗 Gastos Coche</h1>
  </header>

  <!-- VIEW: HOME / REGISTRO -->
  <div class="view active" id="view-home">
    <div class="btn-grid" id="presets-grid"></div>
    <button class="btn-secondary" onclick="openManualForm()">+ Viaje manual</button>
    <button class="btn-secondary" onclick="openPresetForm(null)">+ Nuevo viaje predeterminado</button>
  </div>

  <!-- VIEW: LISTADO -->
  <div class="view" id="view-listado">
    <div class="summary">
      <div class="card">
        <div class="label">Total histórico</div>
        <div class="value" id="total-historico">0,00 €</div>
      </div>
      <div class="card">
        <div class="label">Total filtrado</div>
        <div class="value" id="total-filtrado">0,00 €</div>
      </div>
    </div>
    <div class="filters">
      <select id="filtro-mes">
        <option value="">Todos los meses</option>
      </select>
      <select id="filtro-tipo">
        <option value="">Todos los tipos</option>
        <option value="CIARA">Ciara</option>
        <option value="TRABAJO">Trabajo</option>
      </select>
    </div>
    <div class="filters">
      <input type="date" id="filtro-desde">
      <input type="date" id="filtro-hasta">
      <button onclick="limpiarFiltros()">Limpiar</button>
    </div>
    <div id="lista-viajes"></div>
  </div>

  <!-- VIEW: CONFIG -->
  <div class="view" id="view-config">
    <div class="section-title">Tarifa general</div>
    <div class="card" style="margin-bottom:18px;">
      <div class="label">€ por km</div>
      <div class="field" style="margin:8px 0 0;">
        <input type="number" step="0.001" id="input-precio-km">
      </div>
      <button class="btn-primary" onclick="guardarTarifa()">Guardar tarifa</button>
    </div>
    <div class="section-title">Viajes predeterminados</div>
    <div id="lista-presets-config"></div>

    <div class="section-title">Cuenta</div>
    <p style="font-size:13px; color:var(--text-dim); margin:0 0 10px;" id="config-email"></p>
    <button class="btn-secondary" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<nav class="bottom" style="display:none;">
  <div class="nav-item active" data-view="view-home" onclick="switchView('view-home')">
    <span class="icon">⛽</span>Registrar
  </div>
  <div class="nav-item" data-view="view-listado" onclick="switchView('view-listado')">
    <span class="icon">📋</span>Listado
  </div>
  <div class="nav-item" data-view="view-config" onclick="switchView('view-config')">
    <span class="icon">⚙️</span>Config
  </div>
</nav>

<!-- MODAL: confirmar/editar viaje -->
<div class="modal-overlay" id="modal-viaje">
  <div class="modal">
    <h2 id="modal-viaje-title">Confirmar viaje</h2>
    <div class="field">
      <label>Tipo</label>
      <div class="seg">
        <button type="button" id="seg-ciara" onclick="setTipo('CIARA')">Con Ciara</button>
        <button type="button" id="seg-trabajo" onclick="setTipo('TRABAJO')">Trabajo</button>
      </div>
    </div>
    <div class="field"><label>Origen</label><input id="v-origen"></div>
    <div class="field"><label>Destino</label><input id="v-destino"></div>
    <div class="row2">
      <div class="field"><label>Km</label><input type="number" step="0.1" id="v-km" oninput="recalcTotal()"></div>
      <div class="field"><label>€/km</label><input type="number" step="0.001" id="v-preciokm" oninput="recalcTotal()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Total €</label><input type="number" step="0.01" id="v-total"></div>
      <div class="field"><label>Fecha</label><input type="date" id="v-fecha"></div>
    </div>
    <button class="btn-primary" onclick="guardarViaje()">Guardar</button>
    <button class="btn-ghost" style="width:100%; text-align:center; margin-top:6px;" onclick="closeModal('modal-viaje')">Cancelar</button>
  </div>
</div>

<!-- MODAL: crear/editar preset -->
<div class="modal-overlay" id="modal-preset">
  <div class="modal">
    <h2 id="modal-preset-title">Nuevo viaje predeterminado</h2>
    <div class="field"><label>Nombre del botón</label><input id="p-nombre" placeholder="Ej. Casa → Oficina"></div>
    <div class="field">
      <label>Tipo</label>
      <div class="seg">
        <button type="button" id="pseg-ciara" onclick="setTipoPreset('CIARA')">Con Ciara</button>
        <button type="button" id="pseg-trabajo" onclick="setTipoPreset('TRABAJO')">Trabajo</button>
      </div>
    </div>
    <div class="field"><label>Origen</label><input id="p-origen"></div>
    <div class="field"><label>Destino</label><input id="p-destino"></div>
    <div class="field"><label>Km</label><input type="number" step="0.1" id="p-km"></div>
    <button class="btn-primary" onclick="guardarPreset()">Guardar</button>
    <button class="btn-ghost" style="width:100%; text-align:center; margin-top:6px;" onclick="closeModal('modal-preset')">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
